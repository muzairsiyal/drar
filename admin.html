<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#26382d">
  <title>DR.AR | Store administration</title>
  <style>
    :root{color-scheme:light;--bg:#f7f5ef;--surface:#fffefa;--surface2:#efeee6;--text:#26382d;--muted:#68756a;--green:#344b3b;--green2:#506b53;--gold:#b89b68;--line:#dedfd4;--red:#a34438;--shadow:0 12px 32px #26382d12;font-family:"DM Sans",Arial,sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.hidden{display:none!important}
    .top{height:70px;position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px);background:#26382d;color:#f5f1e6;box-shadow:0 3px 18px #1d2e2322}.brand{display:flex;align-items:baseline;gap:12px;font-size:21px;font-weight:800;letter-spacing:.04em}.brand small{font-size:11px;font-weight:500;letter-spacing:.14em;color:#d4c69d}.top-right{display:flex;align-items:center;gap:16px;color:#dedfd4;font-size:13px}.top-right button{background:none;border:1px solid #ffffff45;border-radius:8px;padding:8px 12px;color:inherit}
    .layout{max-width:1440px;margin:auto;padding:28px clamp(16px,4vw,52px);display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.sidebar{height:max-content;position:sticky;top:94px;border-radius:18px;background:linear-gradient(160deg,#344b3b,#24362c);padding:16px;color:#f6f2e6;box-shadow:var(--shadow)}.side-title{padding:5px 10px 17px;font-weight:800;letter-spacing:.08em}.side-title small{display:block;margin-top:4px;color:#c9cfbd;font-size:11px;font-weight:400;letter-spacing:.04em}.side-nav{display:grid;gap:5px}.side-nav button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;border:0;border-radius:10px;background:transparent;color:#e5e7dc;padding:11px 12px;font-size:13px;font-weight:600}.side-nav button:hover{background:#ffffff14}.side-nav button.active{background:#f5f1e6;color:#304537}.side-foot{margin:20px 10px 4px;color:#c9cfbd;font-size:11px;line-height:1.6}
    main{min-width:0}.welcome{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 24px}.eyebrow{font-size:11px;color:var(--green2);letter-spacing:.16em;text-transform:uppercase;font-weight:700}.welcome h1{font-size:clamp(25px,4vw,34px);letter-spacing:-.04em;margin:6px 0}.welcome p{margin:0;color:var(--muted);font-size:14px}.btn{background:var(--green);color:#fff;border:1px solid var(--green);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:700;transition:transform .16s,background .16s}.btn:hover{background:var(--green2);transform:translateY(-1px)}.btn.light{color:var(--green);background:transparent;border-color:var(--line)}.btn.light:hover{background:var(--surface2)}.btn.danger{background:var(--red);border-color:var(--red)}.btn.small{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.55;cursor:wait;transform:none}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat,.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:7px;font-size:24px;letter-spacing:-.04em}.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:17px;margin:0}.panel-body{padding:18px 20px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px;font-size:13px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}th{background:var(--surface2);color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}tbody tr:hover{background:#f8f7f0}tbody tr:last-child td{border-bottom:0}.table-wrap select{min-width:175px}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 11px;margin:5px 0 12px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #506b531a}label{display:block;color:var(--muted);font-size:12px;font-weight:600}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.badge{display:inline-flex;padding:4px 9px;border-radius:20px;background:#e9eee5;color:#39543d;font-size:11px;font-weight:700}.badge.gold{background:#f2ecd9;color:#76643f}.badge.red{background:#f5e5e0;color:#8f3d34}.muted{color:var(--muted);font-size:12px}.empty{padding:28px;color:var(--muted);text-align:center}.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.toolbar{display:flex;gap:9px;align-items:center}.toolbar input{max-width:280px;margin:0}.toolbar select{width:auto;margin:0}.image-thumb{width:46px;height:46px;object-fit:cover;border-radius:8px;background:var(--surface2)}.progress{display:grid;gap:0}.progress-row{display:grid;grid-template-columns:24px 1fr;gap:11px;position:relative;padding-bottom:16px}.progress-row:not(:last-child):before{content:"";position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--line)}.progress-dot{position:relative;z-index:1;width:20px;height:20px;border:2px solid var(--line);border-radius:50%;background:var(--surface)}.progress-row.current .progress-dot{border-color:var(--gold);background:var(--gold);box-shadow:0 0 0 4px #b89b6826}.progress-row.past .progress-dot{border-color:var(--green2);background:var(--green2)}.progress-row strong{font-size:13px}.progress-row.current strong{color:var(--green);font-size:15px}.progress-row time{display:block;color:var(--muted);font-size:11px;margin-top:3px}
    #toast{position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:10px;background:#26382d;color:white;box-shadow:var(--shadow);font-size:13px;max-width:min(92vw,520px)}.modal{position:fixed;z-index:12;inset:0;background:#18271bb8;display:grid;place-items:center;padding:18px}.modal-box{width:min(100%,620px);max-height:90vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 22px 80px #0003}.modal-box h2{margin:0 0 18px;font-size:20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:10px}.close-x{float:right;border:0;background:none;color:var(--muted);font-size:22px;line-height:1}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 80% 10%,#e7e6d9,transparent 40%),var(--bg)}.login-card{width:min(100%,430px);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(24px,5vw,38px);box-shadow:0 20px 60px #26382d18}.login-card h1{margin:0 0 7px;font-size:27px}.login-card p{color:var(--muted);font-size:14px;line-height:1.6}.login-card .btn{width:100%;padding:12px}.login-brand{margin-bottom:30px;color:var(--green);font-weight:800;font-size:20px;letter-spacing:.06em}.login-brand small{display:block;margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.15em}
    @media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:18px}.layout>main{width:100%;min-width:0}.panel,.panel-body,.table-wrap{min-width:0;max-width:100%}.table-wrap{width:100%;overflow-x:auto;overflow-y:hidden;overscroll-behavior-inline:contain}.sidebar{position:static;padding:10px}.side-title{display:none}.side-nav{display:flex;overflow:auto}.side-nav button{width:auto;white-space:nowrap}.side-foot{display:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){.top{height:60px}.brand{font-size:18px}.brand small{font-size:9px}.top-right{font-size:0;gap:8px}.top-right button{font-size:12px;padding:7px 9px}.layout{padding:16px 12px}.welcome{align-items:start;flex-direction:column}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:21px}.panel-head,.panel-body{padding:14px}.field-row{grid-template-columns:1fr;gap:0}.toolbar{width:100%;align-items:stretch;flex-direction:column}.toolbar input,.toolbar select{max-width:none;width:100%}.modal{padding:10px}.modal-box{padding:17px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
    .cms-section{margin:0 0 16px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.cms-section legend{padding:0 8px;font-weight:700;color:var(--green)}.cms-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.cms-check{display:flex;align-items:center;gap:8px}.cms-check input{width:auto;margin:0}.cms-preview{display:block;max-width:min(100%,360px);max-height:200px;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;object-fit:contain;background:var(--surface2)}.cms-tip{padding:12px 14px;border-left:3px solid var(--gold);background:#f2ecd9;color:#574d36;font-size:12px;line-height:1.55}.cms-actions{position:sticky;bottom:0;z-index:2;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px;background:#fffefaed;border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px)}
    .action-menu{position:relative;display:inline-block;vertical-align:middle}.action-menu>summary{list-style:none;display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s}.action-menu>summary::-webkit-details-marker{display:none}.action-menu>summary:hover,.action-menu[open]>summary{background:var(--surface2);border-color:#b9c3b4}.action-menu>summary:focus-visible{outline:3px solid #506b5350;outline-offset:2px}.action-menu>summary svg{width:19px;height:19px}.action-menu-list{position:fixed;top:var(--action-menu-top,0px);left:var(--action-menu-left,0px);z-index:50;display:grid;gap:3px;width:min(200px,calc(100vw - 24px));max-height:min(280px,calc(100vh - 24px));overflow:auto;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 14px 36px #17291d30}.action-menu:not([open])>.action-menu-list{display:none}.action-menu-list button{display:flex;align-items:center;width:100%;min-height:38px;padding:9px 11px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;font-size:12px;font-weight:600;white-space:normal}.action-menu-list button:hover,.action-menu-list button:focus-visible{background:var(--surface2);outline:none}.action-menu-list button.danger{color:var(--red)}.action-menu-list button.danger:hover{background:#f5e5e0}.action-cell{width:68px;text-align:center}
    @media(max-width:700px){.table-wrap{overflow:visible}.table-wrap table{display:block;width:100%;min-width:0;table-layout:auto}.table-wrap thead{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.table-wrap tbody{display:grid;gap:12px;width:100%}.table-wrap tbody tr{display:grid;gap:0;padding:4px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.table-wrap tbody td{display:grid;grid-template-columns:minmax(82px,34%) minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.table-wrap tbody td:last-child{border-bottom:0}.table-wrap tbody td:before{content:attr(data-label);color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.table-wrap tbody td[colspan]{display:block;text-align:center}.table-wrap tbody td[colspan]:before{content:none}.table-wrap tbody tr:hover{background:var(--surface)}.table-wrap tbody tr:hover td{background:transparent}.table-wrap .action-cell{width:auto;text-align:left}.table-wrap tbody td select{width:100%;min-width:0;margin:0}.table-wrap tbody td .action-menu{justify-self:start}}
  </style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const $=(selector,root=document)=>root.querySelector(selector);
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money=value=>new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(Number(value)||0);
const date=value=>value?new Date(value).toLocaleString('en-PK',{dateStyle:'medium',timeStyle:'short'}):'—';
const config=window.DRAR_SUPABASE_CONFIG;
const db=window.supabase?.createClient&&config?window.supabase.createClient(config.url,config.publishableKey):null;
let session=null,activeTab='overview',toastTimer=null;
let data={products:[],categories:[],orders:[],statuses:[],tickets:[],reviews:[],newsletterEvents:[],subscribers:[],subscriberCount:0,settings:null,cms:null};
function toast(message){const node=$('#toast');node.textContent=message;node.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.add('hidden'),4000)}
function showError(error,fallback){console.error(fallback,error);toast(error?.message||fallback)}
function shell(content){$('#app').innerHTML=`<header class="top"><a class="brand" href="admin.html">DR.AR <small>STORE ADMIN</small></a><div class="top-right"><span>${esc(session?.user?.email||'')}</span><button onclick="signOut()">Sign out</button></div></header><div class="layout"><aside class="sidebar"><div class="side-title">YOUR STORE<small>Manage DR.AR simply</small></div><nav class="side-nav">${[['overview','Overview'],['orders','Orders'],['products','Products'],['categories','Categories'],['statuses','Order statuses'],['newsletter','Newsletter & events'],['support','Support inbox'],['reviews','Reviews'],['website','Website content'],['settings','Store settings']].map(([key,title])=>`<button class="${activeTab===key?'active':''}" onclick="openTab('${key}')">${title}</button>`).join('')}</nav><div class="side-foot">Changes save directly to your store. Customer account sign-up is not available here.</div></aside><main>${content}</main></div>`}
function heading(title,subtitle,action=''){return `<div class="welcome"><div><div class="eyebrow">DR.AR · STORE CONTROL</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</div>`}
function panel(title,body,extra=''){return `<section class="panel"><div class="panel-head"><h2>${title}</h2>${extra}</div>${body}</section>`}
function empty(message){return `<div class="empty">${message}</div>`}
function loginView(message='Sign in with your administrator account to manage the store.'){
  $('#app').innerHTML=`<main class="login-wrap"><form class="login-card" onsubmit="adminSignIn(event)"><div class="login-brand">DR.AR<small>PRIVATE STORE ADMINISTRATION</small></div><h1>Welcome back</h1><p>${esc(message)}</p><label for="admin-email">Administrator email</label><input id="admin-email" type="email" autocomplete="username" required><label for="admin-password">Password</label><input id="admin-password" type="password" autocomplete="current-password" required><button class="btn" type="submit">Sign in securely</button><p class="muted" style="margin-bottom:0">This private page has no sign-up option. Ask the store owner to grant your account administrator access.</p></form></main>`;
}
async function verifyAdmin(current){
  if(!current){session=null;loginView();return false}
  const {data:profile,error}=await db.from('profiles').select('role,full_name').eq('id',current.user.id).single();
  if(error)throw error;
  if(profile.role!=='admin'){await db.auth.signOut();session=null;loginView('This account is not authorized for store administration.');return false}
  session=current;return true;
}
async function adminSignIn(event){
  event.preventDefault();const button=$('button[type=submit]',event.currentTarget);button.disabled=true;button.textContent='Signing in…';
  try{const {data:result,error}=await db.auth.signInWithPassword({email:$('#admin-email').value.trim(),password:$('#admin-password').value});if(error)throw error;if(!await verifyAdmin(result.session))return;await openTab('overview')}
  catch(error){showError(error,'Could not sign in');button.disabled=false;button.textContent='Sign in securely'}
}
async function signOut(){const {error}=await db.auth.signOut();if(error)return showError(error,'Could not sign out');session=null;data={products:[],categories:[],orders:[],statuses:[],tickets:[],reviews:[],newsletterEvents:[],subscribers:[],subscriberCount:0,settings:null};loginView('You have been signed out.')}
async function loadData(){
  const queries=await Promise.all([
    db.from('products').select('id,name,description,category_id,price_pkr,sale_price_pkr,stock,image_url,badge,tags,active,created_at').order('id',{ascending:false}),
    db.from('categories').select('id,name,sort_order,active').order('sort_order'),
    db.from('orders').select('id,order_number,user_id,customer_name,customer_email,customer_phone,delivery_address,delivery_city,subtotal_pkr,shipping_pkr,total_pkr,payment_method,payment_status,status,created_at,order_items(product_name,quantity,unit_price_pkr)').order('created_at',{ascending:false}).limit(250),
    db.from('order_statuses').select('id,label,sort_order,active').order('sort_order'),
    db.from('support_tickets').select('id,customer_name,customer_email,customer_phone,order_reference,subject,message,status,admin_reply,created_at').order('created_at',{ascending:false}).limit(200),
    db.from('reviews').select('id,product_id,rating,body,status,created_at').order('created_at',{ascending:false}).limit(200),
    db.from('store_settings').select('shipping_fee_pkr,free_shipping_over_pkr').eq('id',true).single(),
    db.from('newsletter_events').select('id,title,message,location,event_at,status,created_at,sent_at').order('created_at',{ascending:false}).limit(100),
    db.from('newsletter_subscribers').select('id,email,subscribed_at',{count:'exact'}).eq('active',true).order('subscribed_at',{ascending:false}).limit(500)
  ]);
  for(const result of queries)if(result.error)throw result.error;
  data.products=queries[0].data;data.categories=queries[1].data;data.orders=queries[2].data;data.statuses=queries[3].data;data.tickets=queries[4].data;data.reviews=queries[5].data;data.settings=queries[6].data;data.newsletterEvents=queries[7].data;data.subscribers=queries[8].data;data.subscriberCount=queries[8].count||0;
}
async function loadCms(){const {data:result,error}=await db.from('site_content').select('draft_content,published_content,published_at,updated_at').eq('id',true).single();if(error)throw error;data.cms=result}
async function openTab(tab){
  activeTab=tab;
  try{if(tab==='website'){await loadCms();render();return}await loadData();render()}
  catch(error){showError(error,'Could not load store data. Check your administrator access and database setup.');if(!$('#app .login-card'))shell(heading('Store data unavailable','Refresh this page or contact the owner if the problem continues.')+panel('Connection error',empty(esc(error.message||'Could not load store data.'))))}
}
function render(){
  const pages={overview:overviewView,orders:ordersView,products:productsView,categories:categoriesView,statuses:statusesView,newsletter:newsletterView,support:supportView,reviews:reviewsView,website:websiteView,settings:settingsView};
  shell((pages[activeTab]||overviewView)());
}
function overviewView(){
  const awaiting=data.orders.filter(order=>!['Delivered','Cancelled'].includes(order.status)).length;
  const openTickets=data.tickets.filter(ticket=>!['resolved','closed'].includes(ticket.status)).length;
  const lowStock=data.products.filter(product=>product.active&&product.stock<10).length;
  const recent=data.orders.slice(0,6);
  return `${heading('Good day','A clear snapshot of what needs your attention.')}<section class="stats"><article class="stat"><span>Orders to fulfil</span><strong>${awaiting}</strong></article><article class="stat"><span>Active products</span><strong>${data.products.filter(p=>p.active).length}</strong></article><article class="stat"><span>Low stock</span><strong>${lowStock}</strong></article><article class="stat"><span>Open support messages</span><strong>${openTickets}</strong></article></section>${panel('Recent orders',table(['Order','Customer','Placed','Total','Current status'],recent.map(order=>`<tr><td><b>${esc(order.order_number)}</b></td><td>${esc(order.customer_name)}</td><td>${date(order.created_at)}</td><td>${money(order.total_pkr)}</td><td><span class="badge gold">${esc(order.status)}</span></td></tr>`)),`<button class="btn light small" onclick="openTab('orders')">View all orders</button>`)}`;
}
function table(headers,rows){const labels=headers.map((header,index)=>header.trim()||(index===0?'Image':index===headers.length-1?'Actions':'Details')),labeledRows=rows.map(row=>{const template=document.createElement('template');template.innerHTML=row;template.content.querySelectorAll('tr').forEach(tr=>tr.querySelectorAll('td').forEach((cell,index)=>{if(!cell.hasAttribute('data-label'))cell.dataset.label=cell.hasAttribute('colspan')?'':labels[index]||'Details'}));return template.innerHTML});return `<div class="table-wrap"><table><thead><tr>${headers.map(header=>`<th>${header}</th>`).join('')}</tr></thead><tbody>${labeledRows.length?labeledRows.join(''):`<tr><td colspan="${headers.length}">${empty('Nothing to show yet.')}</td></tr>`}</tbody></table></div>`}
function actionMenu(actions,label='Row actions'){if(!actions.length)return '<span class="muted">—</span>';return `<details class="action-menu"><summary aria-label="${esc(label)}" title="${esc(label)}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></summary><div class="action-menu-list" role="group" aria-label="${esc(label)}">${actions.map(action=>`<button type="button" class="${action.danger?'danger':''}" onclick="${action.handler};closeActionMenu(this)">${esc(action.label)}</button>`).join('')}</div></details>`}
function closeActionMenu(node){node?.closest('.action-menu')?.removeAttribute('open')}
function positionActionMenu(menu){if(!menu?.open)return;const summary=menu.querySelector('summary'),list=menu.querySelector('.action-menu-list');if(!summary||!list)return;const anchor=summary.getBoundingClientRect(),width=Math.min(200,innerWidth-24),height=Math.min(list.scrollHeight,innerHeight-24),left=Math.max(12,Math.min(anchor.right-width,innerWidth-width-12)),top=anchor.bottom+height+8<=innerHeight?anchor.bottom+6:Math.max(12,anchor.top-height-6);menu.style.setProperty('--action-menu-left',`${left}px`);menu.style.setProperty('--action-menu-top',`${top}px`)}
document.addEventListener('click',event=>{const summary=event.target.closest('.action-menu>summary');if(summary){setTimeout(()=>{const menu=summary.closest('.action-menu');document.querySelectorAll('.action-menu[open]').forEach(openMenu=>{if(openMenu!==menu)openMenu.removeAttribute('open')});positionActionMenu(menu)},0);return}if(!event.target.closest('.action-menu'))document.querySelectorAll('.action-menu[open]').forEach(menu=>menu.removeAttribute('open'))});
document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;const menus=[...document.querySelectorAll('.action-menu[open]')];menus.forEach(menu=>menu.removeAttribute('open'));menus[0]?.querySelector('summary')?.focus()});
addEventListener('resize',()=>document.querySelectorAll('.action-menu[open]').forEach(positionActionMenu));

async function setOrderStatus(orderId,status){
  const {error}=await db.from('orders').update({status}).eq('id',orderId);if(error)return showError(error,'Could not update the order status');
  toast('Order status updated');await openTab('orders');

async function showOrder(orderId){
  const order=data.orders.find(item=>item.id===orderId);if(!order)return;
  const {data:history,error}=await db.from('order_status_history').select('status,changed_at').eq('order_id',orderId).order('changed_at').order('id');
  if(error)return showError(error,'Could not load order status history');
  $('#modal-root').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><section class="modal-box"><button class="close-x" aria-label="Close" onclick="closeModal()">×</button><div class="eyebrow">ORDER DETAILS</div><h2>${esc(order.order_number)}</h2><p><b>${esc(order.customer_name)}</b><br>${esc(order.customer_phone)} · ${esc(order.customer_email)}<br>${esc(order.delivery_address)}, ${esc(order.delivery_city)}</p><p>${(order.order_items||[]).map(item=>`${esc(item.product_name)} × ${item.quantity} — ${money(item.unit_price_pkr*item.quantity)}`).join('<br>')}</p><p>Subtotal ${money(order.subtotal_pkr)} · Shipping ${money(order.shipping_pkr)} · <b>Total ${money(order.total_pkr)}</b></p><p>Payment: ${esc(order.payment_method)} · ${esc(order.payment_status)}</p>${timeline(history||[],order.status)}<div class="modal-actions"><button class="btn light" onclick="closeModal()">Close</button></div></section></div>`;
}
function timeline(history,current){
  if(!history.length)history=[{status:current,changed_at:null}];
  return `<div class="progress">${history.map((entry,index)=>`<div class="progress-row ${index===history.length-1?'current':'past'}"><span class="progress-dot"></span><div><strong>${esc(entry.status)}</strong><time>${date(entry.changed_at)}</time></div></div>`).join('')}</div>`;
}

async function saveProduct(event,id){
  event.preventDefault();const form=event.currentTarget;const f=new FormData(form);const button=$('button[type=submit]',form);button.disabled=true;
  try{
    let imageUrl=f.get('image_url')||null;const file=f.get('image');
    if(file?.size){if(file.size>5*1024*1024)throw new Error('Choose an image smaller than 5 MB');const path=`${crypto.randomUUID()}.${file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'}`;const {error}=await db.storage.from('product-images').upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;imageUrl=db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
    const payload={name:String(f.get('name')).trim(),description:String(f.get('description')).trim(),category_id:Number(f.get('category_id')),price_pkr:Number(f.get('price_pkr')),sale_price_pkr:f.get('sale_price_pkr')?Number(f.get('sale_price_pkr')):null,stock:Number(f.get('stock')),badge:String(f.get('badge')).trim(),tags:String(f.get('tags')).split(',').map(tag=>tag.trim()).filter(Boolean),image_url:imageUrl};
    if(payload.sale_price_pkr!==null&&payload.sale_price_pkr>=payload.price_pkr)throw new Error('Sale price must be lower than the regular price');
    const result=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);
    if(result.error)throw result.error;closeModal();toast('Product saved to your store');await openTab('products');
  }catch(error){showError(error,'Could not save product');button.disabled=false}
}

  else{const {error}=await db.from('order_statuses').insert({label,sort_order});if(error)return showError(error,'Could not add status')}

function localDateTime(value){if(!value)return '';const parsed=new Date(value);return new Date(parsed.getTime()-parsed.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function editNewsletterEvent(id){
  const item=data.newsletterEvents.find(event=>event.id===id),current=item||{title:'',message:'',location:'',event_at:null};
  $('#modal-root').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><form class="modal-box" onsubmit="saveNewsletterEvent(event,${id??'null'})"><button class="close-x" type="button" onclick="closeModal()">×</button><h2>${item?'Edit event':'Create an event announcement'}</h2><label>Event title</label><input name="title" value="${esc(current.title)}" maxlength="160" required placeholder="DR.AR at Habbit Shopping Mall"><label>Announcement</label><textarea name="message" rows="5" maxlength="10000" required placeholder="Tell subscribers what is happening and when to visit."></textarea><label>Location (optional)</label><input name="location" value="${esc(current.location)}" maxlength="240" placeholder="Habbit Shopping Mall"><label>Date and time (optional)</label><input name="event_at" type="datetime-local" value="${localDateTime(current.event_at)}"><p class="muted">This is saved as a draft. Sending will email all active subscribers from the verified DR.AR sender address.</p><div class="modal-actions"><button class="btn light" type="button" onclick="closeModal()">Cancel</button><button class="btn">Save draft</button></div></form></div>`;
  if(item)$('textarea[name=message]',$('#modal-root')).value=item.message;
}
async function saveNewsletterEvent(event,id){
  event.preventDefault();const f=new FormData(event.currentTarget),eventAt=String(f.get('event_at')||'');
  const values={title:String(f.get('title')).trim(),message:String(f.get('message')).trim(),location:String(f.get('location')).trim(),event_at:eventAt?new Date(eventAt).toISOString():null};
  const result=id?await db.from('newsletter_events').update(values).eq('id',id).eq('status','draft'):await db.from('newsletter_events').insert(values);
  if(result.error)return showError(result.error,'Could not save the event draft');
  closeModal();toast('Event draft saved');await openTab('newsletter');
}
async function sendNewsletterEvent(id){
  const item=data.newsletterEvents.find(event=>event.id===id);if(!item||!confirm(`Send “${item.title}” to ${data.subscriberCount} active newsletter subscribers? This cannot be undone.`))return;
  const {data:result,error}=await db.functions.invoke('send-newsletter-event',{body:{event_id:id}});
  if(error)return showError(error,'Could not send newsletter event');
  if(result?.failed)toast(`Sent to ${result.sent||0}; ${result.failed} failed. You can retry failed deliveries.`);
  else toast(`Event sent to ${result?.sent||0} subscriber${result?.sent===1?'':'s'}.`);
  await openTab('newsletter');
}
async function deleteNewsletterEvent(id){
  const item=data.newsletterEvents.find(event=>event.id===id);if(!item||!['draft','failed'].includes(item.status)||!confirm(`Delete the ${item.status} event “${item.title}”?`))return;
  const {error}=await db.from('newsletter_events').delete().eq('id',id);if(error)return showError(error,'Could not delete event');toast('Event deleted');await openTab('newsletter');
}

const cmsJsonField=(id,label,value,rows=5)=>`<label for="${id}">${label} (JSON)</label><textarea id="${id}" rows="${rows}" spellcheck="false">${esc(JSON.stringify(value,null,2))}</textarea>`;
const cmsField=(label,value,attrs='')=>`<label>${label}<input ${attrs} value="${esc(value||'')}"></label>`;
function websiteView(){const draft=data.cms?.draft_content;if(!draft)return `${heading('Website content','The CMS draft is not available.')} ${panel('Content unavailable',empty('Check that the website content migration has been applied.'))}`;
const nav=draft.header?.nav_items||[],sections=draft.homepage_sections||[],footer=draft.footer||{},support=draft.support||{};
return `${heading('Website content','Manage published storefront content, homepage sections, support answers, header, and footer.',`<span class="badge ${data.cms.published_at?'':'gold'}">Last published ${data.cms.published_at?date(data.cms.published_at):'Never'}</span>`)}<p class="cms-tip">Homepage history and factory sections start unpublished because approved brand facts and images have not yet been provided. Save drafts while preparing content. Publish only verified claims and approved imagery.</p><form id="website-cms" onsubmit="saveCms(event)">
<fieldset class="cms-section"><legend>Header and navigation</legend>${cmsField('Logo / brand text',draft.header?.logo_text,'data-cms="header.logo_text" maxlength="80" required')}${cmsField('Logo image URL',draft.header?.logo_image_url,'data-cms="header.logo_image_url" type="url"')}${draft.header?.logo_image_url?`<img class="cms-preview" src="${esc(draft.header.logo_image_url)}" alt="Logo preview">`:''}<label>Upload logo image<input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadCmsImage(event,'logo')"></label><div class="field-row"><label>Header CTA label<input data-cms="header.cta_label" maxlength="80" value="${esc(draft.header?.cta_label||'')}"></label><label>Header CTA URL<input data-cms="header.cta_url" value="${esc(draft.header?.cta_url||'')}"></label></div>${cmsJsonField('cms-nav','Navigation links',nav,8)}</fieldset>
<div class="cms-section-head"><h2>Homepage sections</h2><button class="btn light" type="button" onclick="addCmsSection()">+ Add section</button></div>${sections.map((section,index)=>`<fieldset class="cms-section"><legend>${esc(section.key||'Section')} · ${esc(section.type||'')}</legend><div class="cms-section-head"><label class="cms-check"><input type="checkbox" data-section="${index}" data-field="enabled" ${section.enabled?'checked':''}> Show on homepage</label>${actionMenu([{label:'Move section up',handler:`moveCmsSection(${index},-1)`},{label:'Move section down',handler:`moveCmsSection(${index},1)`},{label:'Remove section',handler:`removeCmsSection(${index})`,danger:true}],`Actions for homepage section ${section.key}`)}</div><div class="field-row"><label>Section key<input data-section="${index}" data-field="key" maxlength="60" required value="${esc(section.key||'')}"></label><label>Section type<select data-section="${index}" data-field="type">${['hero','story','factory','benefits','reviews','newsletter'].map(type=>`<option value="${type}" ${section.type===type?'selected':''}>${type}</option>`).join('')}</select></label></div><div class="field-row"><label>Display order<input data-section="${index}" data-field="sort_order" type="number" step="1" value="${Number(section.sort_order)||0}"></label><label>Eyebrow<input data-section="${index}" data-field="eyebrow" maxlength="120" value="${esc(section.eyebrow||'')}"></label></div><label>Heading<input data-section="${index}" data-field="title" maxlength="180" value="${esc(section.title||'')}"></label><label>Description<textarea data-section="${index}" data-field="description" rows="3" maxlength="1600">${esc(section.description||'')}</textarea></label><div class="field-row"><label>Image URL<input data-section="${index}" data-field="image_url" type="url" value="${esc(section.image_url||'')}"></label><label>Image description (alt text)<input data-section="${index}" data-field="image_alt" maxlength="180" value="${esc(section.image_alt||'')}"></label></div>${section.image_url?`<img class="cms-preview" src="${esc(section.image_url)}" alt="Section image preview">`:''}<label>Upload section image<input type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadCmsImage(event,'section',${index})"></label><div class="field-row"><label>Button label<input data-section="${index}" data-field="cta_label" maxlength="80" value="${esc(section.cta_label||'')}"></label><label>Button URL<input data-section="${index}" data-field="cta_url" value="${esc(section.cta_url||'')}"></label></div>${section.items?cmsJsonField(`cms-items-${index}`,'Cards / items',section.items,6):''}</fieldset>`).join('')}
<fieldset class="cms-section"><legend>Footer</legend><label>Brand description<textarea data-cms="footer.brand_description" rows="3" maxlength="600">${esc(footer.brand_description||'')}</textarea></label><div class="field-row"><label>Copyright<input data-cms="footer.copyright" maxlength="160" value="${esc(footer.copyright||'')}"></label><label>Location<input data-cms="footer.location" maxlength="120" value="${esc(footer.location||'')}"></label></div><div class="field-row"><label>Support email<input data-cms="footer.contact_email" type="email" value="${esc(footer.contact_email||'')}"></label><label>Support phone<input data-cms="footer.contact_phone" maxlength="40" value="${esc(footer.contact_phone||'')}"></label></div>${cmsJsonField('cms-social','Social media links',footer.social_links||[],8)}${cmsJsonField('cms-footer-links','Footer navigation links',footer.links||[],8)}</fieldset>
<fieldset class="cms-section"><legend>Support page</legend><label>Introductory text<textarea data-cms="support.intro" rows="3" maxlength="600">${esc(support.intro||'')}</textarea></label><div class="field-row"><label>Support email<input data-cms="support.contact_email" type="email" value="${esc(support.contact_email||'')}"></label><label>Support phone<input data-cms="support.contact_phone" maxlength="40" value="${esc(support.contact_phone||'')}"></label></div><label>WhatsApp business number (country code and digits)<input data-cms="support.whatsapp_number" inputmode="numeric" pattern="[0-9]{7,15}" value="${esc(support.whatsapp_number||'')}"></label>${cmsJsonField('cms-faq','FAQ categories and answers',support.faq_categories||[],12)}</fieldset>
<div class="cms-actions"><button class="btn light" type="submit" name="cms-action" value="draft">Save draft</button><button class="btn" type="submit" name="cms-action" value="publish">Publish changes</button></div></form>`}
function cmsReadJson(id,label){try{return JSON.parse($('#'+id).value)}catch(error){throw new Error(`${label} must contain valid JSON: ${error.message}`)}}
function collectCmsContent(){const form=$('#website-cms'),content=JSON.parse(JSON.stringify(data.cms.draft_content));content.header.logo_text=form.querySelector('[data-cms="header.logo_text"]').value.trim();content.header.logo_image_url=form.querySelector('[data-cms="header.logo_image_url"]').value.trim();content.header.cta_label=form.querySelector('[data-cms="header.cta_label"]').value.trim();content.header.cta_url=form.querySelector('[data-cms="header.cta_url"]').value.trim();content.header.nav_items=cmsReadJson('cms-nav','Navigation links');content.homepage_sections=[...form.querySelectorAll('[data-section][data-field="key"]')].map(keyField=>{const index=keyField.dataset.section,field=name=>form.querySelector(`[data-section="${index}"][data-field="${name}"]`),entry=content.homepage_sections[index]||{};for(const name of ['key','type','sort_order','eyebrow','title','description','image_url','image_alt','cta_label','cta_url']){const node=field(name);if(node)entry[name]=name==='sort_order'?Number(node.value):node.value.trim()}entry.enabled=field('enabled').checked;if(form.querySelector(`#cms-items-${index}`))entry.items=cmsReadJson(`cms-items-${index}`,`Section ${index+1} items`);return entry});content.footer={...content.footer,brand_description:form.querySelector('[data-cms="footer.brand_description"]').value.trim(),copyright:form.querySelector('[data-cms="footer.copyright"]').value.trim(),location:form.querySelector('[data-cms="footer.location"]').value.trim(),contact_email:form.querySelector('[data-cms="footer.contact_email"]').value.trim(),contact_phone:form.querySelector('[data-cms="footer.contact_phone"]').value.trim(),social_links:cmsReadJson('cms-social','Social links'),links:cmsReadJson('cms-footer-links','Footer links')};content.support={...content.support,intro:form.querySelector('[data-cms="support.intro"]').value.trim(),contact_email:form.querySelector('[data-cms="support.contact_email"]').value.trim(),contact_phone:form.querySelector('[data-cms="support.contact_phone"]').value.trim(),whatsapp_number:form.querySelector('[data-cms="support.whatsapp_number"]').value.replace(/\D/g,''),faq_categories:cmsReadJson('cms-faq','Support FAQs')};validateCmsContent(content);return content}
function validateCmsContent(content){if(!content.header.logo_text||!Array.isArray(content.header.nav_items)||!Array.isArray(content.homepage_sections)||!cmsUrlValid(content.header.cta_url))throw new Error('Add a logo name, navigation links, homepage sections, and a valid header CTA URL.');const keys=new Set();for(const item of content.header.nav_items){if(!item.label?.trim()||!cmsUrlValid(item.url))throw new Error('Each navigation link needs a label and a safe URL.')}for(const section of content.homepage_sections){if(!section.key?.trim()||keys.has(section.key))throw new Error('Each homepage section needs a unique key.');keys.add(section.key);if(!Number.isFinite(section.sort_order))throw new Error('Homepage section display order must be a number.');if(!cmsUrlValid(section.cta_url)||!cmsUrlValid(section.image_url))throw new Error(`Section “${section.key}” has an invalid URL.`);if(section.enabled&&(section.key==='brand_history'||section.type==='factory')&&(!section.title?.trim()||!section.description?.trim()||!/^https:\/\//i.test(section.image_url||'')||!section.image_alt?.trim()))throw new Error(`To publish “${section.key}”, add verified copy, an approved HTTPS image, and accessible image text.`)}for(const item of [...content.footer.links,...content.footer.social_links])if(item.url&&!cmsUrlValid(item.url))throw new Error('Footer links must be internal #/ links or use HTTPS, mailto, or tel.');if(content.support.whatsapp_number&&!/^\d{7,15}$/.test(content.support.whatsapp_number))throw new Error('Enter a WhatsApp number with 7–15 digits, including its country code.');if(!Array.isArray(content.support.faq_categories)||content.support.faq_categories.some(category=>!category.name?.trim()||!Array.isArray(category.items)||category.items.some(item=>!item.question?.trim()||!item.answer?.trim())))throw new Error('Each FAQ category needs a name, and every FAQ needs a question and answer.')}
function cmsUrlValid(value){return !value||/^#\/[A-Za-z0-9_~./%-]*$/.test(value)||/^https:\/\/[^ ]+$/i.test(value)||/^mailto:[^ ]+$/i.test(value)||/^tel:[+0-9(). -]+$/i.test(value)}
async function saveCms(event){event.preventDefault();const action=event.submitter?.value||'draft';let content;try{content=collectCmsContent()}catch(error){toast(error.message);return}const button=event.submitter;button.disabled=true;button.textContent=action==='publish'?'Publishing…':'Saving…';const payload={draft_content:content};if(action==='publish'){payload.published_content=content;payload.published_at=new Date().toISOString()}const {data:result,error}=await db.from('site_content').update(payload).eq('id',true).select('draft_content,published_content,published_at,updated_at').single();button.disabled=false;button.textContent=action==='publish'?'Publish changes':'Save draft';if(error)return showError(error,'Could not save website content');data.cms=result;toast(action==='publish'?'Website changes published':'Draft saved');render()}
function addCmsSection(){try{const content=collectCmsContent();const nextOrder=Math.max(-1,...content.homepage_sections.map(section=>Number(section.sort_order)||0))+1;content.homepage_sections.push({key:`new_section_${Date.now()}`,type:'story',enabled:false,sort_order:nextOrder,eyebrow:'',title:'',description:'',image_url:'',image_alt:'',cta_label:'',cta_url:''});data.cms.draft_content=content;render()}catch(error){toast(error.message)}}
function moveCmsSection(index,direction){try{const content=collectCmsContent(),target=index+direction;if(target<0||target>=content.homepage_sections.length)return;[content.homepage_sections[index],content.homepage_sections[target]]=[content.homepage_sections[target],content.homepage_sections[index]];content.homepage_sections.forEach((section,i)=>section.sort_order=i);data.cms.draft_content=content;render()}catch(error){toast(error.message)}}
function removeCmsSection(index){try{const content=collectCmsContent();if(!confirm(`Remove homepage section “${content.homepage_sections[index].key}” from the draft?`))return;content.homepage_sections.splice(index,1);content.homepage_sections.forEach((section,i)=>section.sort_order=i);data.cms.draft_content=content;render()}catch(error){toast(error.message)}}
async function uploadCmsImage(event,target,index){const file=event.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){toast('Choose a JPEG, PNG, or WebP image smaller than 5 MB.');event.target.value='';return}let content;try{content=collectCmsContent()}catch(error){toast(error.message);event.target.value='';return}const extension=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=`${session.user.id}/site-content/${Date.now()}-${crypto.randomUUID()}.${extension}`,{error}=await db.storage.from('product-images').upload(path,file,{contentType:file.type,upsert:false});if(error)return showError(error,'Could not upload the website image');const {data:publicUrl}=db.storage.from('product-images').getPublicUrl(path);if(target==='logo')content.header.logo_image_url=publicUrl.publicUrl;else content.homepage_sections[index].image_url=publicUrl.publicUrl;data.cms.draft_content=content;render();toast('Image uploaded. Save the draft to keep this change.')}
function closeModal(){$('#modal-root').innerHTML=''}
async function start(){
  if(!db){loginView('The secure database client did not load. Refresh the page or contact the store owner.');return}
  try{const {data:result,error}=await db.auth.getSession();if(error)throw error;if(await verifyAdmin(result.session))await openTab('overview')}
  catch(error){showError(error,'Could not verify administrator access');loginView('We could not verify access. Please sign in again.')}
  db.auth.onAuthStateChange((_event,next)=>{session=next;if(!next)loginView('You have been signed out.');else if(!session)setTimeout(()=>start(),0)});
}
start();
</script>
</body>
</html>
