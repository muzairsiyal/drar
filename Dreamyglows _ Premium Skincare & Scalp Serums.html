<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#fff;--bg2:#f8f3f8;--tx:#2a1a2e;--mu:#6f6275;--pl:#5b2a6e;--pl2:#7d3f94;--bd:#e8dcea;--ok:#1f8a4c;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.w{max-width:1100px;margin:auto;padding:0 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
.nav{display:flex;align-items:center;gap:16px;height:60px}
.logo{font-weight:800;font-size:20px;color:var(--pl);letter-spacing:-.5px}

.ic{position:relative;font-size:18px;cursor:pointer;padding:6px}
.cnt{position:absolute;top:-2px;right:-4px;background:var(--pl);color:var(--bg);border-radius:9px;font-size:10px;padding:1px 5px}
.btn{background:var(--pl);color:var(--bg);border:0;border-radius:8px;padding:11px 18px;font-weight:600;cursor:pointer}
.btn.o{background:none;border:1px solid var(--pl);color:var(--pl)}.btn.s{padding:6px 10px;font-size:13px}.btn.d{background:var(--rd);color:#fff}
.hero{background:linear-gradient(135deg,var(--pl),var(--pl2));color:#fff;border-radius:16px;margin:16px 0;padding:56px 28px}
.hero h1{margin:0 0 10px;font-size:clamp(26px,5vw,44px)}.hero p{max-width:520px;opacity:.9}.hero .btn{background:#fff;color:#5b2a6e}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:24px 0}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:18px}
.sec{margin:40px 0}.sec .k{color:var(--pl2);font-size:12px;text-transform:uppercase;letter-spacing:1px}.sec h2{margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.p{border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--bg);position:relative}
.pi{aspect-ratio:1;display:grid;place-items:center;font-size:54px;background:linear-gradient(135deg,var(--bg2),var(--bd));background-size:cover;background-position:center}
.pb{padding:12px}.pb small{color:var(--mu)}.pb h4{margin:4px 0;font-size:15px}
.pr b{color:var(--pl)}.pr s{color:var(--mu);font-size:13px;margin-left:6px}
.bdg{position:absolute;top:8px;left:8px;background:var(--pl);color:var(--bg);font-size:11px;padding:2px 8px;border-radius:9px}
.hb{position:absolute;top:6px;right:8px;background:var(--bg);border-radius:50%;width:30px;height:30px;border:0;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--bd);background:none;border-radius:20px;padding:6px 14px;cursor:pointer}.tabs .on{background:var(--pl);color:var(--bg);border-color:var(--pl)}
.ban{background:var(--bg2);border-radius:16px;padding:32px;display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.row{display:flex;gap:10px}.row>*{flex:1}
footer{background:#2a1233;color:#e9d9ef;margin-top:56px;padding:32px 0;font-size:14px}
.cl{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}.cl .pi{width:64px;aspect-ratio:1;font-size:26px;border-radius:8px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.pay{display:flex;gap:10px;margin:8px 0}.pay label{flex:1;border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;color:var(--tx)}.pay input{width:auto;margin-right:6px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#25d366;color:#fff;border-radius:30px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px #0004}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}.sc{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:80px;background:var(--pl);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
.adm{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}
.adm aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:10px}
.adm aside button{text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;cursor:pointer;font-weight:600}.adm aside .on{background:var(--pl);color:var(--bg)}
.am{min-width:0}@media(max-width:760px){.adm{grid-template-columns:1fr}.adm aside{position:static;flex-direction:row;overflow-x:auto}.adm aside button{white-space:nowrap}}
.mo{position:fixed;inset:0;background:#0008;z-index:20;display:grid;place-items:center;padding:16px}
.mb{background:var(--bg);border-radius:14px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.th{width:48px;height:48px;object-fit:cover;border-radius:8px;background:var(--bg2)}

.wa{width:56px;height:56px;padding:0;border-radius:50%;display:grid;place-items:center}
.tabs a{border:1px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:14px}.tabs a.on{background:var(--pl);color:var(--bg);border-color:var(--pl)}
.stars{color:#e8a31b;letter-spacing:1px;font-size:14px}.stars small{color:var(--mu);letter-spacing:0}.rc{display:block;transition:.2s}.rc:hover{transform:translateY(-3px);box-shadow:0 8px 20px #5b2a6e22}
.adm{grid-template-columns:230px 1fr}
.adm aside{background:linear-gradient(180deg,#3a1748,#24102d);border:0;color:#f3e6f7;padding:14px;border-radius:16px;box-shadow:0 8px 24px #3a174833}
.ab{font-weight:800;font-size:17px;padding:8px 10px 16px}.ab small{display:block;font-weight:400;opacity:.6;font-size:12px}
.adm aside button{color:#e9d3f0;display:flex;justify-content:space-between;align-items:center}.adm aside button:hover{background:#ffffff14}.adm aside .on{background:#fff;color:#4a1d5c}
.adm aside i{background:#e0457b;color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:1px 7px}
.am h2{font-size:26px;margin-bottom:16px}
.am table{background:var(--bg);border:1px solid var(--bd);border-radius:14px;border-collapse:separate;border-spacing:0;overflow:hidden;box-shadow:0 2px 10px #5b2a6e12}
.am th{background:var(--bg2);font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu)}
.am td,.am th{padding:12px 14px;border-bottom:1px solid var(--bd)}.am tr:hover td{background:var(--bg2)}
.am .card{background:var(--bg);border-radius:14px;box-shadow:0 2px 10px #5b2a6e12}
.am .feat .card h3{font-size:24px;color:var(--pl)}
.bd2{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}.bd2.g{background:#1f8a4c22;color:var(--ok)}.bd2.r{background:#c0392b22;color:var(--rd)}.bd2.y{background:#e8a31b22;color:#b57b00}
footer{background:linear-gradient(160deg,#3a1748,#1d0c25);padding:48px 0 0}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:28px}@media(max-width:760px){.fg{grid-template-columns:1fr 1fr}}
.fg h4{margin:0 0 12px;color:#fff}.fg a,.fg span{display:block;color:#d9c4e0;margin-bottom:8px}.fg a:hover{color:#fff}.fl{font-size:22px;color:#fff}
.sor{display:flex;gap:10px;margin-top:14px}.fg a.so{width:38px;height:38px;border-radius:50%;background:#ffffff1a;display:grid;place-items:center;margin:0;color:#fff}.fg a.so:hover{background:#c58bdb;transform:translateY(-2px)}
.fb{border-top:1px solid #ffffff22;margin-top:32px;padding:16px;text-align:center;color:#b9a3c2;font-size:13px}
.ml{max-height:260px;overflow-y:auto;border:1px solid var(--bd);border-radius:10px;margin:12px 0}.ck{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer;color:var(--tx);font-size:14px}.ck input{width:auto;margin:0}.ck small{margin-left:auto;color:var(--mu)}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pl),var(--pl2));color:#fff;font-size:24px;cursor:pointer;box-shadow:0 4px 14px #0004;z-index:8}
.bot{position:fixed;left:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:350px;max-width:calc(100vw - 32px);height:480px;max-height:68vh;max-height:68dvh;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--bd);border-radius:16px;box-shadow:0 12px 36px #0004;z-index:8;overflow:hidden}.bot[hidden]{display:none}
.bh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(135deg,var(--pl),var(--pl2));color:#fff}.bh button{background:none;border:0;color:#fff;cursor:pointer;font-size:16px}
#bmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bm{max-width:88%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4}.bm.ai{background:var(--bg2);align-self:flex-start}.bm.me{background:var(--pl);color:var(--bg);align-self:flex-end}
#bchips{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px;padding:0 10px 8px}#bchips button{white-space:nowrap;flex:none}#bchips button{border:1px solid var(--pl);background:none;color:var(--pl);border-radius:16px;padding:5px 11px;font-size:13px;cursor:pointer}
.bh,#bchips,.bi2{flex:none}.bi2{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd);background:var(--bg)}.bi2 input{margin:0;flex:1;min-width:0;font-size:16px;color:var(--tx);background:var(--bg);-webkit-user-select:text;user-select:text;pointer-events:auto}
.bc{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);background:var(--bg);border-radius:10px;padding:8px;margin:8px 0}.bc .bi{width:56px;height:56px;flex:none;border-radius:8px;background:var(--bd) center/cover;display:grid;place-items:center;font-size:24px}
</style></head><body>
<div id="app"></div><div id="toast"></div><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'PKR '+Number(n).toLocaleString('en-US');
const DEF={settings:{store:'Dreamyglows',whatsapp:'923141298954',phone:'+92 314 1298954',email:'hello@dreamyglows.com',city:'Karachi, Pakistan',shipping:250,freeOver:5000,cardOn:true,adminPass:'admin123',adminPath:'dg-portal-7k3x9q',instagram:'https://www.instagram.com/dreamyglows26/',facebook:'',linkedin:'',tiktok:''},
products:[
{id:1,name:'Vitamin C Radiance Serum',cat:'Skin Care',price:2500,sale:1950,badge:'Bestseller',stock:50,emoji:'🍊',img:''},
{id:2,name:'10% Niacinamide Pore Refiner',cat:'Skin Care',price:2200,sale:1800,badge:'',stock:40,emoji:'💧',img:''},
{id:3,name:'Rosemary Hair Growth Serum',cat:'Hair Care',price:3000,sale:2250,badge:'Bestseller',stock:35,emoji:'🌿',img:''},
{id:4,name:'Medicated Anti-Dandruff Treatment',cat:'Medicated',price:3200,sale:2600,badge:'',stock:25,emoji:'🧴',img:''}],
sections:[
{id:1,type:'hero',on:true,title:'Clinical skincare, made for Pakistan',text:'Targeted active serums engineered for visible results without pricing markup.',cta:'Shop now'},
{id:2,type:'features',on:true,title:'Why Dreamyglows',items:'100% Organic Formula|Free from alcohols, silicones, sulfates and parabens.\nFast Delivery|Nationwide dispatch. Pay by card or cash on delivery.\nDermatologist Verified|Formulated under pharmaceutical supervision.'},
{id:3,type:'products',on:true,title:'Our Products',text:'Highly concentrated remedies'},
{id:4,type:'banner',on:true,title:'Clinical Clean Purity',text:'Disclosed ingredients, cruelty-free certification.',cta:'Explore Formulas'},
{id:5,type:'faq',on:true,title:'Frequently Asked Questions',items:'Suitable for sensitive skin?|Yes, all formulas are pH balanced and fragrance-light.\nShipping time?|2-4 working days across Pakistan.\nReturn policy?|7-day returns on unopened items.'}],
orders:[],next:{p:5,s:6}};
let S;try{S=JSON.parse(localStorage.getItem('dg')||'')}catch(e){}S=S||JSON.parse(JSON.stringify(DEF));S.settings={...DEF.settings,...S.settings};S.users=S.users||[];S.orders=S.orders||[];S.products.forEach(p=>{p.desc=p.desc||'Clinical active formulation'});S.reviews=S.reviews||[];S.complaints=S.complaints||[];S.cats=S.cats||['Skin Care','Hair Care','Oral Care'];
let cart=[],wish=[];try{cart=JSON.parse(localStorage.getItem('dgc')||'[]');wish=JSON.parse(localStorage.getItem('dgw')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('dg',JSON.stringify(S));localStorage.setItem('dgc',JSON.stringify(cart));localStorage.setItem('dgw',JSON.stringify(wish))}catch(e){}};
const toast=m=>{$('#toast').innerHTML='<div class="toast">'+esc(m)+'</div>';setTimeout(()=>$('#toast').innerHTML='',1800)};
const price=p=>p.sale>0?p.sale:p.price;
let cat='All',aTab='revenue',authed=false,payM='cod';
const CATS=()=>['All',...S.cats];
function card(p){const d=p.sale>0&&p.sale<p.price?Math.round(100-p.sale/p.price*100):0;
return `<div class="p">${p.badge?`<span class="bdg">${esc(p.badge)}</span>`:d?`<span class="bdg">-${d}%</span>`:''}<button class="hb" onclick="tw(${p.id})">${wish.includes(p.id)?'♥':'♡'}</button>
<a href="#/product/${p.id}" class="pi" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':esc(p.emoji||'✨')}</a><div class="pb"><small>${esc(p.cat)}</small><h4><a href="#/product/${p.id}">${esc(p.name)}</a></h4>${stars(p.id)}
<div class="pr"><b>${money(price(p))}</b>${d?`<s>${money(p.price)}</s>`:''}</div><button class="btn s" style="margin-top:8px;width:100%" ${p.stock<1?'disabled':''} onclick="add(${p.id})">${p.stock<1?'Sold out':'Add to cart'}</button></div></div>`}
const tw=id=>{wish=wish.includes(id)?wish.filter(x=>x!=id):[...wish,id];save();route()};
const add=id=>{const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});save();toast('Added to cart');hdr()};
const items=()=>cart.map(c=>({...S.products.find(p=>p.id==c.id),q:c.q})).filter(x=>x.name);
const sub=()=>items().reduce((a,i)=>a+price(i)*i.q,0);
const ship=()=>sub()>=S.settings.freeOver||!sub()?0:S.settings.shipping;
function hdr(){const s=S.settings;$('#hd').innerHTML=`<div class="w nav"><a class="logo" href="#/">${esc(s.store)}</a><nav><a href="#/">Home</a><a href="#/shop">Shop</a><a href="#/reviews">Reviews</a><a href="#/complaints">Complaints</a></nav>
<a class="ic" href="#/wishlist">♡${wish.length?`<span class="cnt">${wish.length}</span>`:''}</a><a class="ic" href="#/cart">🛒${cart.length?`<span class="cnt">${cart.reduce((a,c)=>a+c.q,0)}</span>`:''}</a></div>`}
function secHTML(s){
if(s.type=='hero')return `<div class="hero"><h1>${esc(s.title)}</h1><p>${esc(s.text)}</p><a class="btn" href="#/shop">${esc(s.cta)}</a></div>`;
if(s.type=='features')return `<div class="feat">${(s.items||'').split('\n').filter(Boolean).map(l=>{const[a,b]=l.split('|');return `<div class="card"><b>${esc(a)}</b><p style="color:var(--mu);margin:6px 0 0">${esc(b)}</p></div>`}).join('')}</div>`;
if(s.type=='products')return `<div class="sec"><div class="k">${esc(s.text)}</div><h2>${esc(s.title)}</h2><div class="tabs">${CATS().map(c=>`<button class="${c==cat?'on':''}" onclick="cat='${esc(c)}';route()">${esc(c)}</button>`).join('')}</div><div class="grid">${S.products.filter(p=>cat=='All'||p.cat==cat).map(card).join('')}</div></div>`;
if(s.type=='banner')return `<div class="sec"><div class="ban"><div><div class="k" style="color:var(--pl2)">${esc(s.title)}</div><h2 style="margin:4px 0">${esc(s.text)}</h2></div><a class="btn" href="#/shop">${esc(s.cta)}</a></div></div>`;
if(s.type=='faq')return `<div class="sec"><h2>${esc(s.title)}</h2>${(s.items||'').split('\n').filter(Boolean).map(l=>{const[a,b]=l.split('|');return `<details><summary>${esc(a)}</summary><p style="color:var(--mu)">${esc(b)}</p></details>`}).join('')}</div>`;
if(s.type=='reviews')return `<div class="sec"><div class="k">${esc(s.text)}</div><h2>${esc(s.title)}</h2><div class="feat" style="margin:0">${S.reviews.slice(0,6).map(rcard).join('')}</div><p><a class="btn o" href="#/reviews">See all reviews</a></p></div>`;
if(s.type=='categories')return `<div class="sec"><h2>${esc(s.title)}</h2><div class="feat" style="margin:0">${S.cats.map(c=>`<a class="card rc" href="#/shop/${encodeURIComponent(c)}" style="text-align:center"><div style="font-size:34px">${{'Skin Care':'🧴','Hair Care':'🌿','Oral Care':'🦷'}[c]||'✨'}</div><b>${esc(c)}</b><br><small style="color:var(--mu)">${S.products.filter(p=>p.cat==c).length} products</small></a>`).join('')}</div></div>`;
if(s.type=='newsletter')return `<div class="sec card"><h2>${esc(s.title)}</h2><div class="row"><input placeholder="Email"><button class="btn" onclick="toast('Subscribed!')">Subscribe</button></div></div>`;return''}
function home(){return `<div class="w">${S.sections.filter(s=>s.on).map(secHTML).join('')}</div>`}
function shop(c){const l=S.products.filter(p=>!c||p.cat==c);return `<div class="w sec"><h2>${esc(c||'Shop All')}</h2><div class="tabs">${['',...S.cats].map(x=>`<a class="${x==(c||'')?'on':''}" href="#/shop${x?'/'+encodeURIComponent(x):''}">${x||'All'}</a>`).join('')}</div><div class="grid">${l.map(card).join('')||'<p>No products in this category yet.</p>'}</div></div>`}
function wl(){return `<div class="w sec"><h2>Wishlist</h2><div class="grid">${S.products.filter(p=>wish.includes(p.id)).map(card).join('')||'<p>Nothing saved yet.</p>'}</div></div>`}
function cartV(){const l=items();return `<div class="w sec"><h2>Your Cart</h2>${l.length?`<div class="two"><div>${l.map(i=>`<div class="cl"><div class="pi">${esc(i.emoji||'✨')}</div><div style="flex:1"><b>${esc(i.name)}</b><br>${money(price(i))}</div><button class="btn o s" onclick="q(${i.id},-1)">−</button> ${i.q} <button class="btn o s" onclick="q(${i.id},1)">+</button></div>`).join('')}</div>
<div class="card"><p>Subtotal <b style="float:right">${money(sub())}</b></p><p>Shipping <b style="float:right">${ship()?money(ship()):'Free'}</b></p><h3>Total <span style="float:right">${money(sub()+ship())}</span></h3><a class="btn" style="display:block;text-align:center" href="#/checkout">Checkout</a></div></div>`:'<p>Your cart is empty.</p>'}</div>`}
const q=(id,d)=>{const c=cart.find(x=>x.id==id);c.q+=d;if(c.q<1)cart=cart.filter(x=>x.id!=id);save();route()};
function checkout(){if(!cart.length)return cartV();return `<div class="w sec"><h2>Checkout</h2><div class="two"><div>
<label>Full name</label><input id="cn"><label>Phone</label><input id="cp" inputmode="tel"><label>Email</label><input id="ce" type="email"><label>Address</label><textarea id="ca" rows="2"></textarea><label>City</label><input id="cc">
<label>Payment method</label><div class="pay"><label><input type="radio" name="pm" ${payM=='cod'?'checked':''} onclick="payM='cod';route()">Cash on Delivery</label>${S.settings.cardOn?`<label><input type="radio" name="pm" ${payM=='card'?'checked':''} onclick="payM='card';route()">Credit / Debit Card</label>`:''}</div>
${payM=='card'?`<div class="card"><label>Card number</label><input id="cardn" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" oninput="this.value=this.value.replace(/\\D/g,'').replace(/(.{4})/g,'$1 ').trim()"><div class="row"><div><label>Expiry</label><input id="exp" placeholder="MM/YY" maxlength="5"></div><div><label>CVC</label><input id="cvc" inputmode="numeric" maxlength="4"></div></div><small style="color:var(--mu)">🔒 Demo only. In production this form is the gateway's secure hosted field — card data never touches your server.</small></div>`:''}

function place(){const g=i=>($('#'+i)||{}).value||'';if(!g('cn')||!g('cp')||!g('ca')||!g('cc'))return toast('Please fill all delivery fields');

function upl(inp){const f=inp.files[0];if(!f)return;if(!['image/jpeg','image/png'].includes(f.type)){inp.value='';return toast('Only JPEG or PNG images are allowed')}
const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);pimg=c.toDataURL('image/jpeg',.82);const v=$('#pvw');v.src=pimg;v.hidden=false};im.src=r.result};r.readAsDataURL(f)}

/* ---------- MIGRATION / SEED ---------- */
if(!S.v3){S.v3=1;S.products.forEach(p=>{if(!S.cats.includes(p.cat))p.cat='Hair Care'});
const mk=(name,desc,price,sale,emoji)=>{const p={id:S.next.p++,name,desc,cat:'Oral Care',price,sale,stock:30,badge:'',emoji,img:''};S.products.push(p);return p.id};
const a=mk('Whitening Mint Toothpaste','Fluoride-enriched daily toothpaste that gently whitens and protects enamel.',900,720,'🦷'),b=mk('Herbal Mouthwash','Alcohol-free herbal rinse for fresh breath and healthy gums.',1100,890,'🌿');
const R=[[1,'Ayesha K.',5,'My dark spots have faded noticeably in 3 weeks. Lightweight and absorbs fast.'],[1,'Sara M.',4,'Good serum, slight tingling at first but my skin glows now.'],[2,'Hamza R.',5,'Pores look smaller and oil is under control. Great value.'],[3,'Fatima Z.',5,'Baby hairs are growing along my hairline. Using it for 2 months.'],[3,'Usman A.',4,'Nice rosemary smell, no greasy feeling. Hair fall reduced.'],[4,'Zainab H.',5,'Dandruff gone after the second wash. Very effective.'],[a,'Bilal S.',5,'Teeth feel clean and fresh all day. Best toothpaste I have tried.'],[b,'Mariam T.',4,'Refreshing without the burning of alcohol mouthwashes.']];
S.reviews=R.filter(r=>S.products.some(p=>p.id==r[0])).map((r,i)=>({id:i+1,pid:r[0],name:r[1],rating:r[2],text:r[3],date:new Date(Date.now()-i*864e5*3).toISOString()}));
['facebook','linkedin','tiktok'].forEach(k=>{if(!S.settings[k])S.settings[k]='https://www.'+k+'.com/'});
const fi=S.sections.findIndex(s=>s.type=='faq');S.sections.splice(fi<0?S.sections.length:fi,0,{id:S.next.s++,type:'reviews',on:true,title:'What Our Customers Say',text:'Real reviews'});
S.sections.splice(1,0,{id:S.next.s++,type:'categories',on:true,title:'Shop by Category'});save()}
/* ---------- ADMIN: complaints & reviews ---------- */
const nOpen=()=>S.complaints.filter(c=>c.status=='Open').length;
function aCmp(){return `<div class="sc"><table><tr><th>Date</th><th>User</th><th>Complaint</th><th>Status</th><th>Comment &amp; action</th></tr>${S.complaints.map(c=>`<tr><td>${dt(c.date)}</td><td><b>${esc(c.name)}</b><br><small>${esc(c.email)}${c.phone?' · '+esc(c.phone):''}</small></td><td style="max-width:300px"><b>${esc(c.subject)}</b><br><small>${esc(c.msg)}</small></td><td><span class="bd2 ${c.status=='Open'?'y':c.status=='Resolved'?'g':'r'}">${c.status}</span></td><td style="min-width:250px">${c.status=='Open'?`<textarea id="cc${c.id}" rows="2" placeholder="Comment: why resolved / why it cannot be processed"></textarea><button class="btn s" onclick="cact(${c.id},'Resolved')">Resolve</button> <button class="btn d s" onclick="cact(${c.id},'Declined')">Decline</button>`:`<small>${esc(c.comment||'—')}</small>`}</td></tr>`).join('')||'<tr><td colspan="5">No complaints received.</td></tr>'}</table></div>`}
const cact=(id,st)=>{const v=$('#cc'+id).value.trim();if(!v)return toast('Please add a comment first');const c=S.complaints.find(x=>x.id==id);c.status=st;c.comment=v;save();route()};
function aRvw(){return `<div class="card" style="max-width:620px;margin-bottom:18px"><h3 style="margin-top:0;font-size:18px;color:var(--tx)">Add a review</h3><label>Product *</label><select id="rp">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><div class="row"><div><label>Reviewer name *</label><input id="rn"></div><div><label>Rating *</label><select id="rr">${[5,4,3,2,1].map(n=>`<option>${n}</option>`).join('')}</select></div></div><label>Review *</label><textarea id="rt" rows="3"></textarea><button class="btn" onclick="ar()">Add review</button></div>
<div class="sc"><table><tr><th>Product</th><th>Reviewer</th><th>Rating</th><th>Review</th><th></th></tr>${S.reviews.map(r=>`<tr><td>${esc(pname(r.pid))}</td><td>${esc(r.name)}</td><td class="stars">${star(r.rating)}</td><td style="max-width:300px"><small>${esc(r.text)}</small></td><td><button class="btn d s" onclick="dr(${r.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No reviews.</td></tr>'}</table></div>`}
const ar=()=>{const n=$('#rn').value.trim(),x=$('#rt').value.trim();if(!n||!x)return toast('All fields are required');S.reviews.unshift({id:Date.now(),pid:+$('#rp').value,name:n,rating:+$('#rr').value,text:x,date:new Date().toISOString()});save();route();toast('Review added')};
const dr=id=>{if(confirm('Delete this review?')){S.reviews=S.reviews.filter(r=>r.id!=id);save();route()}};
/* ---------- ADMIN: categories ---------- */
let catView=null;
function aCat(){if(catView!==null){const l=S.products.filter(p=>p.cat==catView);return `<button class="btn o s" onclick="catView=null;route()">← All categories</button><h3 style="margin:14px 0">${esc(catView)} <span class="bd2 g">${l.length} products</span></h3>${aProd(l)}`}
return `<button class="btn" style="margin-bottom:12px" onclick="cf()">+ Add new category</button><div class="sc"><table><tr><th>Category</th><th>Products</th><th>Actions</th></tr>${S.cats.map((c,i)=>`<tr><td><b>${esc(c)}</b></td><td>${S.products.filter(p=>p.cat==c).length}</td><td style="white-space:nowrap"><button class="btn o s" onclick="catView=S.cats[${i}];route()">View</button> <button class="btn o s" onclick="cf(${i})">Edit</button> <button class="btn d s" onclick="cdel(${i})">Delete</button></td></tr>`).join('')||'<tr><td colspan="3">No categories.</td></tr>'}</table></div>`}
function cf(i){const e=i!=null;$('#modal').innerHTML=`<div class="mo" onclick="if(event.target==this)cm()"><div class="mb"><h3 style="margin-top:0">${e?'Edit':'Add new'} category</h3><label>Category name *</label><input id="cn2" value="${e?esc(S.cats[i]):''}"><div class="row" style="margin-top:8px"><button class="btn o" onclick="cm()">Cancel</button><button class="btn" onclick="csv(${e?i:-1})">Save</button></div></div></div>`}
function csv(i){const n=$('#cn2').value.trim();if(!n)return toast('Category name is required');if(S.cats.some((c,k)=>k!=i&&c.toLowerCase()==n.toLowerCase()))return toast('This category already exists');
if(i<0)S.cats.push(n);else{const o=S.cats[i];S.cats[i]=n;S.products.forEach(p=>{if(p.cat==o)p.cat=n});if(catView==o)catView=n}save();cm();route();toast('Category saved')}
function cdel(i){const c=S.cats[i],n=S.products.filter(p=>p.cat==c).length;if(n)return toast('Move or delete its '+n+' product(s) first');if(confirm('Delete category "'+c+'"?')){S.cats.splice(i,1);save();route()}}
function mvm(id){const p=S.products.find(x=>x.id==id);$('#modal').innerHTML=`<div class="mo" onclick="if(event.target==this)cm()"><div class="mb"><h3 style="margin-top:0">Move product</h3><small style="color:var(--mu)">${esc(p.name)} — tick the category to move it there.</small><div class="ml">${S.cats.map((c,i)=>`<label class="ck"><input type="checkbox" ${c==p.cat?'checked':''} onchange="doMv(${id},${i})"><span>${esc(c)}</span><small>${S.products.filter(x=>x.cat==c).length} products</small></label>`).join('')}</div><button class="btn o" onclick="cm()">Close</button></div></div>`}
const doMv=(id,i)=>{S.products.find(x=>x.id==id).cat=S.cats[i];save();cm();route();toast('Moved to '+S.cats[i])};
/* ---------- CHATBOT ---------- */
if(!S.v4){S.v4=1;const T=[[/vitamin c/i,'pigmentation, dark spots, dull skin, glow, dry skin'],[/niacinamide/i,'acne, pores, oily skin, dry skin, skin barrier'],[/rosemary/i,'hair fall, hair growth, thinning hair'],[/dandruff/i,'dandruff, itchy scalp'],[/toothpaste/i,'teeth whitening, cavity, plaque'],[/mouthwash/i,'bad breath, gums, mouth']];S.products.forEach(p=>{if(!p.tags){const m=T.find(x=>x[0].test(p.name));p.tags=m?m[1]:''}});save()}
const PT={acne:['acne','pimple','pores','blemish'],dry:['dry skin','dryness','hydrat','moistur','barrier'],oily:['oily','sebum'],pigment:['pigment','dark spot','dull','glow','brighten'],hairfall:['hair fall','hair growth','thinning','hair loss'],dandruff:['dandruff','itchy scalp'],teeth:['teeth','tooth','whiten','cavity','plaque'],breath:['breath','gums','mouth']};
const CR={acne:/acne|pimple|zit|breakout|muhas|daan[ae]/i,dry:/dry|khushk|flaky|dehydrat/i,oily:/oily|greasy|chikna/i,pigment:/pigment|dark spot|dull|glow|\btan\b|daag|brighten|uneven/i,hairfall:/hair ?fall|hair loss|thinning|jhad|hair growth|baal/i,dandruff:/dandruff|roosi|itchy scalp/i,teeth:/teeth|tooth|dant|cavity|plaque/i,breath:/breath|\bgums?\b|mouth|badbu/i};
const LB={acne:'acne',dry:'dry skin',oily:'oily skin',pigment:'dark spots / dullness',hairfall:'hair fall',dandruff:'dandruff',teeth:'teeth care',breath:'fresh breath'};
let bctx={concerns:new Set(),budget:null,gender:null},bmsg=[],bchips=[];
const ptext=p=>((p.tags||'')+' '+p.name+' '+(p.desc||'')+' '+p.cat).toLowerCase();
function bdraw(){const m=$('#bmsgs');if(!m)return;m.innerHTML=bmsg.map(x=>`<div class="bm ${x.r=='me'?'me':'ai'}">${x.h}</div>`).join('');$('#bchips').innerHTML=bchips.map(c=>`<button onclick="botSend('${c}')">${c}</button>`).join('');m.scrollTop=m.scrollHeight}
const bpush=(r,h)=>{bmsg.push({r,h});bdraw()};
const bcard=p=>`<div class="bc"><a class="bi" href="#/product/${p.id}" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':esc(p.emoji||'✨')}</a><div><b><a href="#/product/${p.id}">${esc(p.name)}</a></b><br><span style="color:var(--pl)">${money(price(p))}</span><br><button class="btn s" style="margin-top:4px" onclick="add(${p.id})">Add to cart</button></div></div>`;
function recommend(){const cs=[...bctx.concerns],bud=bctx.budget=='any'||bctx.budget==null?Infinity:bctx.budget,lbl=cs.map(k=>LB[k]).join(' + ');
const cov=p=>cs.filter(c=>PT[c].some(w=>ptext(p).includes(w)));
const av=S.products.filter(p=>p.stock>0).map(p=>({p,c:cov(p)})).filter(x=>x.c.length);
const ok=av.filter(x=>price(x.p)<=bud).sort((a,b)=>b.c.length-a.c.length||avg(b.p.id)-avg(a.p.id)||price(a.p)-price(b.p));
const note=' All our formulas are unisex, so they suit you perfectly.';
if(ok[0]&&ok[0].c.length==cs.length)return `Great news! For <b>${lbl}</b>, this one covers everything within your budget:${bcard(ok[0].p)}${note}`;
let best=null;for(const a of ok)for(const b of ok)if(a.p.id<b.p.id&&new Set([...a.c,...b.c]).size==cs.length){const s=price(a.p)+price(b.p);if(s<=bud&&(!best||s<best.s))best={a,b,s}}
if(best)return `No single product covers all of <b>${lbl}</b>, but this combo fits your budget (total ${money(best.s)}):${bcard(best.a.p)}${bcard(best.b.p)}${note}`;
if(ok.length)return `Within your budget, the closest matches for <b>${lbl}</b> are:${ok.slice(0,2).map(x=>bcard(x.p)).join('')}They cover ${ok[0].c.map(k=>LB[k]).join(' + ')}.${note}`;
if(av.length){const x=av.sort((a,b)=>price(a.p)-price(b.p))[0];return `I could not find a match under ${money(bud)}. The most affordable option for your concern is slightly above budget:${bcard(x.p)}`}
return `I could not find a matching product for that yet. Please browse our <a href="#/shop" style="color:var(--pl)">shop</a> or message us on WhatsApp and our team will help.`}
function bnext(first){const c=bctx;
if(!c.concerns.size){bchips=['Acne and dry skin','Hair fall','Dandruff','Dark spots','Teeth whitening'];return bpush('bot',first?'Hi! 👋 I am your Dreamyglows assistant. Tell me what you need — for example <i>"a cream for acne and dry skin"</i> — and I will find the right product for you.':'Could you tell me your concern? For example acne, dry skin, hair fall, dandruff, dark spots or teeth whitening.')}
if(c.budget==null){bchips=['Under 1500','Under 2500','Under 4000','No limit'];return bpush('bot',`Noted: <b>${[...c.concerns].map(k=>LB[k]).join(' + ')}</b>. What is your budget (in PKR)?`)}
if(c.gender==null){bchips=['Male','Female','Prefer not to say'];return bpush('bot','Thanks! May I know your gender? It helps me personalise the advice.')}
bchips=['Start over'];bpush('bot',recommend())}
function botSend(txt){txt=(txt||$('#bin').value).trim();if(!txt)return;$('#bin').value='';bpush('me',esc(txt));
if(/start over|restart|reset/i.test(txt)){bctx={concerns:new Set(),budget:null,gender:null};return setTimeout(()=>bnext(true),300)}
for(const k in CR)if(CR[k].test(txt))bctx.concerns.add(k);
if(/no limit|any budget|no budget|koi bhi/i.test(txt))bctx.budget='any';else{const m=txt.match(/(\d[\d,]*(?:\.\d+)?)\s*(k)?\b/i);if(m){let n=parseFloat(m[1].replace(/,/g,''));if(m[2])n*=1000;if(n>=100)bctx.budget=n}}
if(/prefer not|skip/i.test(txt))bctx.gender='any';else if(/\b(female|woman|girl|lady|ladki|aurat)\b/i.test(txt))bctx.gender='female';else if(/\b(male|man|boy|larka|mard)\b/i.test(txt))bctx.gender='male';
setTimeout(()=>bnext(),450)}
function botInit(){$('#botw').innerHTML=`<button class="fab" onclick="botToggle()" aria-label="Chat assistant"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8.5" width="16" height="11.5" rx="4"/><path d="M12 8.5V5"/><circle cx="12" cy="3.6" r="1.3" fill="currentColor"/><circle cx="9" cy="13.6" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="13.6" r="1.4" fill="currentColor" stroke="none"/><path d="M9.5 17h5"/><path d="M2 13.5v3M22 13.5v3"/></svg></button><div class="bot" id="bpanel" hidden><div class="bh"><b>🤖 Skin &amp; Care Assistant</b><button onclick="botToggle()" aria-label="Close">✕</button></div><div id="bmsgs"></div><div id="bchips"></div><div class="bi2"><input id="bin" type="text" placeholder="Type your question…" autocomplete="off" autocapitalize="sentences" enterkeyhint="send" onkeydown="if(event.key=='Enter'){event.preventDefault();botSend()}"><button class="btn s" onclick="botSend()">Send</button></div></div>`}
const botToggle=()=>{const p=$('#bpanel');p.hidden=!p.hidden;if(!p.hidden&&!bmsg.length)bnext(true);else bdraw();if(!p.hidden)setTimeout(()=>{const i=$('#bin');if(i)i.focus()},80)};
/* ---------- ROUTER ---------- */
function route(){const h=location.hash.slice(2).split('/'),r=h[0],a=h[1]?decodeURIComponent(h[1]):'';hdr();
$('#main').innerHTML=location.hash.slice(1)==S.settings.adminPath?admin():r=='shop'?shop(a):r=='product'?prodPage(+a):r=='reviews'?revPage(a):r=='complaints'?cmpPage():r=='cart'?cartV():r=='checkout'?checkout():r=='wishlist'?wl():home();
$('#ft').innerHTML=footer();$('#botw').style.display=location.hash.slice(1)==S.settings.adminPath?'none':'';const w=$('#wa');w.innerHTML=sico('whatsapp');w.href='https://wa.me/'+esc(S.settings.whatsapp)+'?text='+encodeURIComponent('Hello! I would like to inquire about your products.')}
$('#app').innerHTML='<header id="hd"></header><main id="main"></main><footer id="ft"></footer><a class="wa" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp"></a><div id="botw"></div>';
botInit();addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
</script></body></html>
