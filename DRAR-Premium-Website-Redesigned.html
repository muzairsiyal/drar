/* UI refinement: consistent page gutters and DR.AR forest-green / warm-gold footer */
:root{--page-gutter:clamp(18px,5vw,76px);}

.nav-toggle{display:none;}

header{background:#f3f0e8ef;border-color:var(--bd);}

.editor-price{margin-top:auto;}

guestWishlistMerge=(async()=>{const guestLists=readGuestWishlists(),{data:existing,error:loadError}=await sb.from('wishlist_lists').select('id,name,is_default').eq('user_id',userId);if(loadError)throw loadError;

if(newLists.length){const {error}=await sb.from('wishlist_lists').insert(newLists);if(error)throw error}
if(!hasDefault){const guestDefault=guestLists.find(list=>list.is_default),matchingDefault=existing.find(list=>list.name.toLowerCase()===guestDefault?.name.toLowerCase());if(matchingDefault){const {error}=await sb.from('wishlist_lists').update({is_default:true}).eq('id',matchingDefault.id);if(error)throw error}}
const {data:allLists,error:listsError}=await sb.from('wishlist_lists').select('id,name').eq('user_id',userId);if(listsError)throw listsError;
const entries=guestLists.flatMap(guest=>{const target=allLists.find(list=>list.name.toLowerCase()===guest.name.toLowerCase());return target?guest.product_ids.map(product_id=>({wishlist_id:target.id,product_id})):[]});
if(entries.length){const {error}=await sb.from('wishlist_list_items').upsert(entries,{onConflict:'wishlist_id,product_id',ignoreDuplicates:true});if(error)throw error}

try{return await guestWishlistMerge}finally{guestWishlistMerge=null}}

if(section.type==='benefits')return `<section class="editor-section editor-benefits" data-reveal="hidden"><div class="editor-section-head centered"><div><div class="editor-eyebrow">${eyebrow}</div><h2>${title}</h2>${description?`<p>${description}</p>`:''}</div></div><div class="editor-benefit-grid">${(section.items||[]).map((item,i)=>`<article><span>${String(i+1).padStart(2,'0')}</span><h3>${esc(item.title||'')}</h3><p>${esc(item.text||'')}</p></article>`).join('')}</div></section>`;
if(section.type==='reviews'){const reviews=(S.reviews||[]).slice(0,8),cards=reviews.map(reviewTile).join('');return `<section class="editor-section editor-reviews" data-reveal="hidden"><div class="editor-section-head"><div><div class="editor-eyebrow">${eyebrow}</div><h2>${title}</h2></div><a class="editor-textlink" href="${esc(safeLink(section.cta_url,'#/reviews'))}">${esc(section.cta_label||'Read all reviews')} ↗</a></div><div class="editor-review-viewport"><div class="editor-review-track" aria-label="Customer reviews"><div class="editor-review-group">${cards||'<p class="editor-review-empty">No published reviews yet. We look forward to hearing about your experience with DR.AR.</p>'}</div>${cards?`<div class="editor-review-group" aria-hidden="true">${cards}</div>`:''}</div></div><div class="editor-track-note">Real routines. Personal experiences. <div class="editor-track-controls"><button type="button" aria-label="Previous customer review" onclick="scrollReviews(1)">←</button><button type="button" aria-label="Next customer review" onclick="scrollReviews(-1)">→</button></div></div></section>`}
if(section.type==='newsletter')return `<section class="editor-newsletter" data-reveal="hidden"><div class="editor-eyebrow">${eyebrow}</div><h2>${title}</h2><p>${description}</p><form class="newsletter-form" onsubmit="subscribeNewsletter(event)"><label class="sr-only" for="newsletter-email">Email address</label><input id="newsletter-email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="Your email address" required><button type="submit">${esc(section.cta_label||'Subscribe')}</button></form><small class="newsletter-note">By subscribing, you agree to receive occasional updates from DR.AR. Unsubscribe anytime.</small></section>`;
return ''}
function renderHome(){const sections=(siteContent.homepage_sections||[]).filter(section=>section.enabled!==false).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));return `<div class="editor-home">${sections.map(cmsSection).join('')}</div>`}
let reviewTween=null,reviewMotionCleanup=null;
function startReviewMotion(){if(reviewTween){reviewTween.kill();reviewTween=null}const track=$('.editor-review-track'),group=track?.querySelector('.editor-review-group');if(!track||!group)return;const distance=group.getBoundingClientRect().width+(parseFloat(getComputedStyle(track).gap)||0);if(distance<=track.parentElement.clientWidth+1){track.style.transform='';return}if(!window.gsap){track.style.transform='';return}const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;gsap.set(track,{x:reduce?0:-distance});if(reduce)return;
reviewTween=gsap.to(track,{x:0,duration:Math.max(28,distance/32),ease:'none',repeat:-1,onRepeat:()=>gsap.set(track,{x:-distance})});const pause=()=>reviewTween?.pause(),resume=()=>reviewTween?.resume();track.addEventListener('mouseenter',pause);track.addEventListener('mouseleave',resume);track.addEventListener('focusin',pause);track.addEventListener('focusout',resume);reviewMotionCleanup=()=>{track.removeEventListener('mouseenter',pause);track.removeEventListener('mouseleave',resume);track.removeEventListener('focusin',pause);track.removeEventListener('focusout',resume)}}
function scrollReviews(direction){if(!window.gsap)return;const track=$('.editor-review-track'),first=track?.querySelector('.editor-review'),group=track?.querySelector('.editor-review-group');if(!track||!first||!group)return;const distance=group.getBoundingClientRect().width+(parseFloat(getComputedStyle(track).gap)||0),cardWidth=first.getBoundingClientRect().width+(parseFloat(getComputedStyle(group).gap)||0);if(!distance||!cardWidth)return;reviewTween?.pause();const current=Number(gsap.getProperty(track,'x'));let target=(Number.isFinite(current)?current:0)+direction*cardWidth;if(target>=0)target-=distance;if(target<=-distance)target+=distance;if(matchMedia('(prefers-reduced-motion: reduce)').matches){gsap.set(track,{x:target});return}gsap.to(track,{x:target,duration:.45,ease:'power2.out',onComplete:()=>{if(!track.matches(':hover,:focus-within'))reviewTween?.resume()}})}
function supportPage(){const support=siteContent.support||SITE_DEFAULT.support,categories=support.faq_categories||[];const number=String(support.whatsapp_number||'').replace(/\D/g,'');return `<div class="w sec editor-support"><div class="support-intro"><div class="editor-eyebrow">HERE TO HELP</div><h1>Customer support</h1><p>${esc(support.intro||'')}</p><div class="support-contacts">${support.contact_email?`<a href="mailto:${esc(support.contact_email)}">Email support <span>${esc(support.contact_email)}</span></a>`:''}${support.contact_phone?`<a href="tel:${esc(support.contact_phone.replace(/[^+0-9]/g,''))}">Call us <span>${esc(support.contact_phone)}</span></a>`:''}${number?`<a href="https://wa.me/${esc(number)}" target="_blank" rel="noopener noreferrer">WhatsApp us <span>Chat with our team</span></a>`:''}</div><a class="btn" href="#/complaints">Send a support request</a></div>${categories.map(category=>`<section class="support-category"><h2>${esc(category.name||'Questions')}</h2><div class="editor-faq-list">${(category.items||[]).map((item,i)=>`<details><summary><span>${String(i+1).padStart(2,'0')}</span>${esc(item.question||'')}<b>＋</b></summary><p>${esc(item.answer||'')}</p></details>`).join('')}</div></section>`).join('')}</div>`}

async function subscribeNewsletter(event){event.preventDefault();if(!sb)return toast('Newsletter sign-up is temporarily unavailable');const form=event.currentTarget,button=$('button[type=submit]',form),email=$('#newsletter-email',form).value.trim();button.disabled=true;button.textContent='Joining…';const {data,error}=await sb.functions.invoke('newsletter',{body:{action:'subscribe',email}});if(error){button.disabled=false;button.textContent='Subscribe';console.error('Newsletter sign-up failed',error);return toast(await functionErrorMessage(error,'Could not subscribe right now'))}if(!data?.subscribed){button.disabled=false;button.textContent='Subscribe';return toast('Could not confirm your subscription')}$('#main').innerHTML='<div class="w sec" style="text-align:center"><h1>You’re on the list.</h1><p>Thank you for subscribing to occasional DR.AR updates and event news.</p><a class="btn" href="#/">Back to home</a></div>'}

function portalActionMenu(actions,label='Available actions'){return `<details class="portal-action-menu"><summary aria-label="${esc(label)}" title="${esc(label)}"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></summary><div class="portal-action-menu-list" role="group" aria-label="${esc(label)}">${actions.map(action=>action.href?`<a href="${esc(action.href)}" role="menuitem" onclick="closePortalActionMenu(this)">${esc(action.label)}</a>`:`<button type="button" role="menuitem" class="${action.danger?'danger':''}" ${action.disabled?'disabled':''} onclick="${action.handler};closePortalActionMenu(this)">${esc(action.label)}</button>`).join('')}</div></details>`}

function positionPortalActionMenu(menu){if(!menu?.open)return;const summary=menu.querySelector('summary'),list=menu.querySelector('.portal-action-menu-list');if(!summary||!list)return;const anchor=summary.getBoundingClientRect(),width=Math.min(205,innerWidth-24),height=Math.min(list.scrollHeight,innerHeight-24),left=Math.max(12,Math.min(anchor.right-width,innerWidth-width-12)),top=anchor.bottom+height+8<=innerHeight?anchor.bottom+6:Math.max(12,anchor.top-height-6);menu.style.setProperty('--portal-menu-left',`${left}px`);menu.style.setProperty('--portal-menu-top',`${top}px`)}
document.addEventListener('click',event=>{const summary=event.target.closest('.portal-action-menu>summary');if(summary){setTimeout(()=>{const menu=summary.closest('.portal-action-menu');document.querySelectorAll('.portal-action-menu[open]').forEach(openMenu=>{if(openMenu!==menu)openMenu.removeAttribute('open')});positionPortalActionMenu(menu)},0);return}if(!event.target.closest('.portal-action-menu'))document.querySelectorAll('.portal-action-menu[open]').forEach(menu=>menu.removeAttribute('open'))});

let authCooldownTimer,passwordRecoveryActive=false;
function authFeedback(node,error,fallback){clearInterval(authCooldownTimer);const message=backendMessage(error,fallback),match=message.match(/after\s+(\d+)\s+seconds?/i);if(!node){toast(match?`Please wait ${match[1]} seconds before trying again.`:message);return}if(!match){node.textContent=message;return}let remaining=Number(match[1]);node.textContent=`Please wait ${remaining} seconds before trying again.`;authCooldownTimer=setInterval(()=>{remaining-=1;if(remaining<=0){clearInterval(authCooldownTimer);node.textContent='You can try again now.';return}node.textContent=`Please wait ${remaining} seconds before trying again.`},1000)}

async function requestPasswordReset(event){event.preventDefault();const email=$('#recovery-email').value.trim().toLowerCase(),button=$('button[type=submit]',event.currentTarget),feedback=$('#auth-feedback');button.disabled=true;button.textContent='Sending…';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:`${location.origin}${location.pathname}`});if(error){console.error('Password recovery request failed',error);authFeedback(feedback,error,'Could not request a password reset');button.disabled=false;button.textContent='Send reset link';return}feedback.textContent='If an account exists for that email, a secure reset link will be sent.';button.textContent='Request sent'}

async function signIn(){const email=$('#account-email').value.trim().toLowerCase(),password=$('#account-password').value,button=$('.account-form button[type=submit]'),form=$('.account-form');if(!email||!password)return toast('Enter your email and password');button.disabled=true;button.textContent='Signing in…';const {error}=await sb.auth.signInWithPassword({email,password});if(error){console.error('Sign-in failed',error);let feedback=$('#auth-feedback');if(!feedback){feedback=document.createElement('div');feedback.id='auth-feedback';feedback.className='auth-feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');form.insertBefore(feedback,form.querySelector('.account-links'))}authFeedback(feedback,error,'Could not sign in');button.disabled=false;button.textContent='Sign in';return}toast('Signed in')}
function statusClass(label){const status=String(label||'').toLowerCase();if(status.includes('cancel'))return 'status-cancelled';if(status.includes('out for'))return 'status-out';if(status.includes('ready')||status.includes('pack'))return 'status-ready';if(status.includes('shipped')||status.includes('dispatch'))return 'status-shipped';if(status.includes('delivered'))return 'status-delivered';return 'status-placed'}
function statusTimeline(history,current){const events=history?.length?history:[{status:current,changed_at:null}];return `<div class="status-timeline">${events.map((event,index)=>`<div class="status-event ${statusClass(event.status)} ${index===events.length-1?'current':''}"><span class="status-dot"></span><div><b>${esc(event.status)}</b><small>${event.changed_at?dt(event.changed_at):'Current status'}</small></div></div>`).join('')}</div>`}

function trackV(){const fromAccount=Boolean(sbSession),orderNumber=location.hash.startsWith('#/track/')?decodeURIComponent(location.hash.slice('#/track/'.length)):'';let savedToken='';try{savedToken=sessionStorage.getItem('drar-order-'+orderNumber)||''}catch(error){console.error('Could not read saved guest tracking code',error)}return `<div class="w sec" style="max-width:680px"><div class="editor-eyebrow">ORDER UPDATES</div><h2>${fromAccount?'Track your order':'Track an order'}</h2><p>${fromAccount?'Enter the tracking number from your order history.':'Enter the order number and private verification code from your order confirmation. The code keeps guest order details private.'}</p><form class="card" novalidate onsubmit="event.preventDefault();trackOrder()"><label for="track-number">Order / tracking number</label><input id="track-number" type="text" autocomplete="off" maxlength="13" pattern="DR-[A-Fa-f0-9]{10}" title="Enter the tracking number in the format DR- followed by 10 letters or numbers." placeholder="DR-XXXXXXXXXX" value="${esc(orderNumber)}" required>${fromAccount?'':`<label for="track-token">Private verification code</label><input id="track-token" type="password" autocomplete="off" minlength="64" maxlength="64" pattern="[A-Fa-f0-9]{64}" title="Enter the 64-character private code from your order confirmation." placeholder="Enter the private code from your confirmation" value="${esc(savedToken)}" required><small class="tracking-help">This code is only required for guest orders. Find it in your order confirmation; it prevents other people from viewing your order.</small>`}<button class="btn" type="submit">Show order status</button><div id="tracking-result" class="tracking-result" role="status" aria-live="polite"></div></form></div>`}
async function trackOrder(){const numberInput=$('#track-number'),tokenInput=$('#track-token'),orderNumber=numberInput.value.trim().toUpperCase(),trackingToken=tokenInput?.value.trim()||'',result=$('#tracking-result');numberInput.value=orderNumber;result.innerHTML='';if(!orderNumber){const message='Enter your order / tracking number.';result.innerHTML=`<p class="tracking-error">${message}</p>`;toast(message);numberInput.focus();return}if(!/^DR-[A-F0-9]{10}$/.test(orderNumber)){const message='That tracking number does not look right. Enter the number in the format DR-XXXXXXXXXX.';result.innerHTML=`<p class="tracking-error">${message}</p>`;toast('Please enter a valid tracking number');numberInput.focus();return}if(!sbSession&& !/^[A-Fa-f0-9]{64}$/.test(trackingToken)){const message='Enter the 64-character private verification code from your order confirmation.';result.innerHTML=`<p class="tracking-error">${message}</p>`;toast('Enter the private code from your order confirmation');tokenInput?.focus();return}if(!sb){const message='Order tracking is temporarily unavailable. Please try again later.';result.innerHTML=`<p class="tracking-error">${message}</p>`;toast(message);return}const button=$('.card button[type="submit"]');button.disabled=true;button.textContent='Looking up your order…';result.innerHTML='<p class="tracking-loading">Checking your order details…</p>';try{const {data,error}=await sb.functions.invoke('order-status',{body:{order_number:orderNumber,tracking_token:trackingToken}});if(error){const message=await functionErrorMessage(error,'Could not look up this order'),notFound=error.status===404?'We could not find an order with those details. Check the tracking number and private code.':message;result.innerHTML=`<p class="tracking-error">${esc(notFound)}</p>`;toast(notFound);return}if(!data?.order){const message='We could not find an order with those details. Check the tracking number and private code.';result.innerHTML=`<p class="tracking-error">${message}</p>`;toast(message);return}const order=data.order;result.innerHTML=`<article class="order-card"><div class="order-card-heading"><div><small>TRACKING NUMBER</small><h3>${esc(order.order_number)}</h3></div><span class="status-current ${statusClass(order.status)}">${esc(order.status)}</span></div><p>${esc((order.items||[]).map(item=>`${item.product_name} × ${item.quantity}`).join(', '))}</p><b>${money(order.total_pkr)}</b><p>Payment method: ${esc(order.payment_method==='cod'?'Cash on delivery (COD)':order.payment_method==='online'?'Online payment':order.payment_method)}</p><p class="muted">Payment status: ${esc(order.payment_status)}</p>${statusTimeline(order.history,order.status)}</article>`}catch(error){console.error('Order status lookup failed',error);const message=backendMessage(error,'Could not look up this order. Please try again.');result.innerHTML=`<p class="tracking-error">${esc(message)}</p>`;toast(message)}finally{button.disabled=false;button.textContent='Show order status'}}

function recommend(){const cs=[...bctx.concerns],bud=bctx.budget=='any'||bctx.budget==null?Infinity:bctx.budget,lbl=cs.map(k=>LB[k]).join(' + ');
const cov=p=>cs.filter(c=>PT[c].some(w=>ptext(p).includes(w)));
const av=S.products.filter(p=>p.stock>0).map(p=>({p,c:cov(p)})).filter(x=>x.c.length);
const ok=av.filter(x=>price(x.p)<=bud).sort((a,b)=>b.c.length-a.c.length||avg(b.p.id)-avg(a.p.id)||price(a.p)-price(b.p));

if(ok[0]&&ok[0].c.length==cs.length)return `Great news! For <b>${lbl}</b>, this one covers everything within your budget:${bcard(ok[0].p)}${note}`;
let best=null;for(const a of ok)for(const b of ok)if(a.p.id<b.p.id&&new Set([...a.c,...b.c]).size==cs.length){const s=price(a.p)+price(b.p);if(s<=bud&&(!best||s<best.s))best={a,b,s}}

if(ok.length)return `Within your budget, the closest matches for <b>${lbl}</b> are:${ok.slice(0,2).map(x=>bcard(x.p)).join('')}They cover ${ok[0].c.map(k=>LB[k]).join(' + ')}.${note}`;

return `I could not find a matching product for that yet. Please browse our <a href="#/shop" style="color:var(--pl)">shop</a> or message us on WhatsApp and our team will help.`}
